<style>

<body>
<h1>rob run offsets</h1>
<p class="sub">2026-11-11 23:50 · <a href="../">версии</a> · <a href="../../">активная</a></p>
<p class="warn">не актуальная версия · старый дамп</p>
<p class="status" id="status">loading ...</p>
<div class="meta" id="meta"></div>
<div class="row">
 <a class="btn" href="offsets.hpp">offsets.hpp</a>
 <a class="btn" href="Offsets.h">Offsets.h</a>
 <a class="btn" href="offsets.json">offsets.json</a>
 <button class="btn" id="copy-hpp" type="button">copy hpp</button>
 <button class="btn" id="copy-json" type="button">copy json</button>
</div>
<p class="hint">namespace off · include offsets.hpp</p>
<pre class="paste" id="paste">loading offsets.hpp ...</pre>
<script>
function esc(s) {
 return String(s).replace(/[&<>"']/g, function (c) {
  return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
 });
}
async function load() {
 var st = document.getElementById("status");
 var metaEl = document.getElementById("meta");
 var paste = document.getElementById("paste");
 try {
  var r = await fetch("offsets.json", { cache: "no-store" });
  if (!r.ok) throw new Error("offsets.json " + r.status);
  var j = await r.json();
  st.textContent = "old · " + (j["Dumped At"] || "?");
  metaEl.innerHTML =
   "<div><b>Game</b> " + esc(j["Game"] || "Rob Run") + "</div>" +
   "<div><b>Dumped At</b> " + esc(j["Dumped At"] || "?") + "</div>" +
   "<div><b>Dumper</b> " + esc(j["Dumped With"] || "?") + " " + esc(j["Dumper Version"] || "") + "</div>" +
   "<div><b>Total Offsets</b> " + esc(String(j["Total Offsets"] != null ? j["Total Offsets"] : "?")) + "</div>";
  var hp = await fetch("offsets.hpp", { cache: "no-store" });
  if (!hp.ok) throw new Error("offsets.hpp " + hp.status);
  var hpp = await hp.text();
  paste.textContent = hpp;
  window.__HPP = hpp;
  window.__JSON = JSON.stringify(j, null, 2);
  document.getElementById("copy-hpp").onclick = function () {
   navigator.clipboard.writeText(window.__HPP || "");
   st.textContent = "copied offsets.hpp";
  };
  document.getElementById("copy-json").onclick = function () {
   navigator.clipboard.writeText(window.__JSON || "");
   st.textContent = "copied offsets.json";
  };
 } catch (e) {
  st.className = "status err";
  st.textContent = "fail: " + e;
  paste.textContent = "fail load offsets.hpp";
 }
}
load();
</script>
</body>
</html>

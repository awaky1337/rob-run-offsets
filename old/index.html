<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rob run offsets · versions</title>
<style>
html,body{margin:0;background:#1e1e2e;color:#cdd6f4}
html{scrollbar-width:none}
body::-webkit-scrollbar{display:none;width:0;height:0}
body{
 font-family:Consolas,"Cascadia Mono","Courier New",monospace;
 padding:16px 20px 48px;
}
h1{font-size:14px;font-weight:normal;color:#cba6f7;margin:0 0 6px}
.sub{color:#a6adc8;font-size:11px;margin:0 0 14px}
.sub a{color:#89b4fa;text-decoration:none}
.sub a:hover{color:#b4befe}
.status{color:#a6e3a1;font-size:12px;margin:0 0 12px}
.status.err{color:#f38ba8}
.row{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:0}
a.btn{
 font:inherit;font-size:12px;color:#cdd6f4;background:#313244;border:1px solid #45475a;
 padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-block;border-radius:8px
}
a.btn:hover{border-color:#b4befe;color:#b4befe;background:#45475a}
.note{color:#6c7086}
</style>
</head>
<body>
<h1>rob run offsets</h1>
<p class="sub" data-en-html="old versions · <a href=&quot;../&quot;>active</a>" data-ru-html="старые версии · <a href=&quot;../&quot;>актуальная</a>">old versions · <a href="../">active</a></p>
<p class="status" id="status">loading ...</p>
<div class="row" id="list"></div>
<script>
function esc(s) {
 return String(s).replace(/[&<>"']/g, function (c) {
  return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
 });
}
async function load() {
 var st = document.getElementById("status");
 var list = document.getElementById("list");
 try {
  var r = await fetch("versions.json", { cache: "no-store" });
  if (!r.ok) throw new Error("versions.json " + r.status);
  var rows = await r.json();
  st.textContent = rows.length + " old";
  list.innerHTML = rows.map(function (v) {
  var note = window.rrLang === "ru" ? (v.note_ru || v.note || "") : (v.note_en || v.note || "");
   return '<a class="btn" href="' + esc(v.id) + '/">' + esc(v.title) + ' · ' + esc(v.total) + ' · ' + esc(note) + '</a>';
  }).join("");
 } catch (e) {
  st.className = "status err";
  st.textContent = "fail: " + e;
 }
}
load();
document.addEventListener("rr-lang", load);
</script>
<script src="../lang.js"></script>
</body>
</html>
